name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish stable release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ github.event.release.tag_name }}
      cancel-in-progress: false

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=commonjs --eval '
            const { version } = require("./package.json")
            const tag = process.env.RELEASE_TAG
            if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
              throw new Error(`Release tag ${tag} must match stable package version ${version}`)
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Publish package
        run: npm publish --access public
